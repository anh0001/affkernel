# Resolution probe — 800x800 eval (no retrain).
#
# Re-evaluates the EXISTING v3 checkpoint at 800x800. The affordance head is
# fully convolutional, so it adapts to the larger feature grid; GT is loaded at
# original resolution, so no GT re-rasterization. eval_spatial_size MUST be
# overridden in BOTH HybridEncoder (pos-embed) and RTDETRTransformer (anchors),
# which are precomputed at init from that field (hybrid_encoder.py:256,
# rtdetr_decoder.py:443) — otherwise the precomputed grids mismatch the 800px
# feature maps. The val Resize is swapped to a square 800.
__include__: ['./rtdetr_r50vd_6x_iit_v3.yml']

output_dir: ./output/probe_res800

HybridEncoder:
  eval_spatial_size: [800, 800]

RTDETRTransformer:
  eval_spatial_size: [800, 800]

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}
  batch_size: 4
