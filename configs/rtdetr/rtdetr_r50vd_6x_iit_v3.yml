# Stride-4 readout recipe plus two affordance-accuracy levers.
#
# Builds on the preceding recipe (stride-4 mask feature + Dice/focal/boundary
# loss + cosine LR + reduced_dim/DYN_HIDDEN 16). Adds, on the affordance branch
# ONLY (detector untouched):
#   1. A stride-4 lateral from the backbone's second-stage feature map
#      (return_idx 0, 256 ch @ stride 4); the lateral adds it to the shared
#      affordance map, so the dynamic kernels get *real* high-res detail
#      instead of a learned 2x upsample of the stride-8 encoder feature. This
#      attacks the dominant ablation lever (resolution, -0.071 leave-one-out)
#      at its source.
#   2. Box-relative geometry channels — per-instance (rx, ry, inside) offsets
#      appended to the dynamic-kernel input, giving the kernels object-relative
#      grounding (handle = box edge, cutting edge, pound face, support surface).
#      Targets the weak classes (grasp / pound / cut).
#
# A separate output_dir keeps the earlier recipe's checkpoints intact for
# comparison. Trains from scratch (the architecture changed). Seed, epochs and
# batch size are identical to that earlier recipe.
__include__: [
  '../dataset/iit_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/affkernel_r50vd.yml',
]

output_dir: ./output/rtdetr_r50vd_6x_iit_v3

# Expose backbone C2 (stride-4, 256 ch) in addition to C3/C4/C5. RTDETR.forward
# routes the extra finest level to the affordance branch; the encoder still
# consumes exactly [C3, C4, C5].
PResNet:
  return_idx: [0, 1, 2, 3]

AffordanceBranch:
  low_level_dim: 256      # ResNet50-d C2 channels (stride-4 lateral)
  use_box_relative: True  # per-instance (rx, ry, inside) geometry channels
