
use_ema: True 
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000


find_unused_parameters: True 

epoches: 72
clip_max_norm: 0.1

optimizer:
  type: AdamW
  params: 
    - 
      params: 'backbone'
      lr: 0.00001
    - 
      params: '^(?=.*encoder(?=.*bias|.*norm.*weight)).*$'
      weight_decay: 0.
    -
      params: '^(?=.*decoder(?=.*bias|.*norm.*weight)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Cosine annealing over the full 72-epoch schedule (stepped once per epoch in
# DetSolver.fit). Replaces MultiStepLR milestones:[1000], which never fired in
# 72 epochs -> constant LR -> the documented F_beta^w plateau. Each AdamW param
# group anneals from its own base lr (backbone 1e-5, rest 1e-4) to eta_min.
lr_scheduler:
  type: CosineAnnealingLR
  T_max: 72
  eta_min: 0.000001

