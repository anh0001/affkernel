[project]
name = "affkernel"
version = "0.1.0"
description = "Per-query dynamic-convolution kernels over a shared high-resolution affordance map for RT-DETR affordance detection and segmentation"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Anhar Risnumawan" }]
keywords = ["affordance-detection", "affordance-segmentation", "rt-detr", "object-detection", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://github.com/anh0001/affkernel"
Repository = "https://github.com/anh0001/affkernel"
Issues = "https://github.com/anh0001/affkernel/issues"

[tool.ruff]
# The runtime is Python 3.8: keep this at py38 so pyupgrade (UP) never rewrites
# typing.Optional[X] / Union[X, Y] into 3.10+ `X | None` syntax, which would
# raise TypeError at import time on 3.8.
target-version = "py38"
line-length = 100
src = ["src", "tools", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle (PEP8), F: pyflakes, I: import sorting,
# UP: pyupgrade, B: bugbear. Keep the set conservative for an
# existing codebase; expand once it is clean.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by the formatter
    "B008",  # function calls in defaults are common in ML configs
]

[tool.ruff.lint.per-file-ignores]
# The upstream RT-DETR component registry is driven by star re-exports: each
# package's __init__.py does `from .module import *` so that YAML configs can
# name components by string. Removing the star imports (F403) or the resulting
# "unused" re-exports (F401) would break config-driven construction.
"__init__.py" = ["F403", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
